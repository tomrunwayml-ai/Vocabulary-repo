<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speak & Save Dictionary</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;font-family:Arial,sans-serif;color:#172033}
.wrap{max-width:850px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:24px;border-radius:20px;margin-bottom:16px}
h1{margin:0 0 6px}.hero p{margin:0;opacity:.9}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}
.row{display:flex;gap:9px;flex-wrap:wrap}input,textarea{flex:1;min-width:200px;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}textarea{min-height:100px;width:100%;margin-top:10px}
button{padding:12px 15px;border:0;border-radius:10px;font-weight:700;cursor:pointer;background:#e8edff;color:#17337c}button.primary{background:#2563eb;color:white}button.danger{background:#fee2e2;color:#991b1b}
#status{color:#667085;font-size:14px;margin-top:10px;min-height:20px}.item{border:1px solid #e5e7eb;border-radius:13px;padding:14px;margin-top:10px}.word{font-size:21px;font-weight:700}.meaning{line-height:1.55;margin:8px 0;color:#344054}.meta{font-size:12px;color:#667085}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.count{color:#667085;font-size:14px}
@media(max-width:600px){.wrap{padding:10px}.hero{padding:20px}.row>*{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>🎙️ Speak & Save Dictionary</h1><p>Speak a word, get its meaning, and save your vocabulary.</p></section>

<section class="card">
<div class="row">
<input id="word" placeholder="Speak or type a word">
<button class="primary" id="speak">🎙️ Speak</button>
<button id="google">🔎 Google</button>
</div>
<div id="status">Ready. Tap Speak and say one English word.</div>
<textarea id="meaning" placeholder="Meaning will appear here automatically..."></textarea>
<div class="row" style="margin-top:9px">
<button class="primary" id="save">💾 Save Word</button><button id="clear">Clear</button>
</div>
</section>

<section class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 style="margin:0">Saved Words</h2><span class="count" id="count"></span>
</div>
<div class="row" style="margin-top:12px"><input id="filter" placeholder="Search saved words"><button id="export">⬇️ Export</button><button class="danger" id="deleteAll">Delete All</button></div>
<div id="list"></div>
</section>
</div>

<script>
const KEY="speak-save-dictionary-v2";
let data=JSON.parse(localStorage.getItem(KEY)||"[]"), editing=null;
const $=x=>document.getElementById(x);
const status=x=>$("status").textContent=x;
const esc=x=>x.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

async function meaning(word){
  if(!word)return;
  status("Looking up the meaning...");
  $("meaning").value="";
  try{
    const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word));
    if(!r.ok)throw 0;
    const d=await r.json(), e=d[0];
    const out=[];
    (e.meanings||[]).slice(0,3).forEach(m=>{
      const defs=(m.definitions||[]).slice(0,2);
      defs.forEach((x,i)=>out.push((m.partOfSpeech?m.partOfSpeech+": ":"")+x.definition+(x.example?"\nExample: "+x.example:"")));
    });
    $("meaning").value=out.join("\n\n");
    status("Meaning found. Edit if needed, then tap Save Word.");
  }catch{
    status("Couldn't fetch the definition. Use Google, then paste the meaning and save it.");
  }
}

$("speak").onclick=()=>{
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){status("Speech recognition isn't supported here. Use Chrome on Android or a supported browser.");return}
  const r=new R(); r.lang="en-IN"; r.interimResults=false; r.maxAlternatives=1;
  status("Listening... speak now.");
  r.onresult=e=>{const w=e.results[0][0].transcript.trim().replace(/[.,!?]$/,"");$("word").value=w;meaning(w)}
  r.onerror=e=>status("Microphone/speech error: "+e.error+". Check browser microphone permission.");
  r.start();
};
$("google").onclick=()=>{const w=$("word").value.trim();if(w)window.open("https://www.google.com/search?q="+encodeURIComponent(w+" meaning"),"_blank")}
$("word").addEventListener("keydown",e=>{if(e.key==="Enter")meaning($("word").value.trim())});

$("save").onclick=()=>{
 const w=$("word").value.trim(),m=$("meaning").value.trim();
 if(!w||!m){status("Enter a word and meaning first.");return}
 if(editing){let x=data.find(x=>x.id===editing);if(x){x.word=w;x.meaning=m}editing=null}
 else data.unshift({id:Date.now().toString(),word:w,meaning:m,date:new Date().toISOString()});
 localStorage.setItem(KEY,JSON.stringify(data));$("word").value="";$("meaning").value="";status("Saved.");render();
};
$("clear").onclick=()=>{editing=null;$("word").value="";$("meaning").value="";status("Cleared.")};
window.del=id=>{data=data.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(data));render()};
window.edit=id=>{let x=data.find(x=>x.id===id);if(!x)return;editing=id;$("word").value=x.word;$("meaning").value=x.meaning;window.scrollTo({top:0,behavior:"smooth"})};
window.g=id=>{let x=data.find(x=>x.id===id);if(x)window.open("https://www.google.com/search?q="+encodeURIComponent(x.word+" meaning"),"_blank")};

function render(){
 const q=$("filter").value.toLowerCase(), a=data.filter(x=>(x.word+" "+x.meaning).toLowerCase().includes(q));
 $("count").textContent=data.length+" word"+(data.length===1?"":"s");
 $("list").innerHTML=a.length?a.map(x=>`<div class="item"><div class="word">${esc(x.word)}</div><div class="meta">${new Date(x.date).toLocaleString()}</div><div class="meaning">${esc(x.meaning).replace(/\n/g,"<br>")}</div><div class="actions"><button onclick="edit('${x.id}')">✏️ Edit</button><button onclick="g('${x.id}')">🔎 Google</button><button class="danger" onclick="del('${x.id}')">Delete</button></div></div>`).join(""):"<p style='color:#667085;text-align:center'>No saved words yet.</p>";
}
$("filter").oninput=render;
$("deleteAll").onclick=()=>{if(data.length&&confirm("Delete all saved words?")){data=[];localStorage.setItem(KEY,"[]");render()}};
$("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="my-dictionary.json";a.click()};
render();
</script>
</body>
</html>
