<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Speak & Save Dictionary</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6fb;
    color:#172033;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.hero{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    padding:24px;
    border-radius:20px;
    margin-bottom:16px;
}

.hero h1{
    margin:0 0 7px;
}

.hero p{
    margin:0;
    opacity:.9;
}

.card{
    background:white;
    padding:18px;
    border-radius:16px;
    margin-bottom:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.row{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

input{
    flex:1;
    min-width:200px;
    padding:13px;
    border:1px solid #d0d5dd;
    border-radius:10px;
    font-size:16px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 15px;
    font-weight:bold;
    cursor:pointer;
    background:#e8edff;
    color:#17337c;
}

button.primary{
    background:#2563eb;
    color:white;
}

button.audio{
    background:#111827;
    color:white;
}

button.danger{
    background:#fee2e2;
    color:#991b1b;
}

#status{
    margin-top:10px;
    color:#667085;
    font-size:14px;
    min-height:20px;
}

.result{
    margin-top:15px;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:16px;
    display:none;
}

.result-word{
    font-size:28px;
    font-weight:700;
}

.part{
    color:#667085;
    font-style:italic;
    margin-top:3px;
}

.pronunciation{
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
}

.definition{
    margin-top:15px;
    line-height:1.6;
}

.example{
    margin-top:12px;
    padding:12px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    line-height:1.5;
}

.saved-item{
    border:1px solid #e5e7eb;
    border-radius:13px;
    padding:14px;
    margin-top:10px;
}

.saved-word{
    font-size:21px;
    font-weight:bold;
}

.saved-pronunciation{
    color:#667085;
    margin-top:4px;
}

.saved-definition{
    margin-top:8px;
    line-height:1.55;
}

.saved-example{
    margin-top:8px;
    color:#475467;
    font-style:italic;
}

.meta{
    color:#667085;
    font-size:12px;
    margin-top:6px;
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:10px;
}

.count{
    color:#667085;
    font-size:14px;
}

@media(max-width:600px){

    .container{
        padding:10px;
    }

    .hero{
        padding:20px;
    }

    .row{
        flex-direction:column;
    }

    input,
    button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="hero">
    <h1>🎙️ Speak & Save Dictionary</h1>
    <p>
        Speak a word → get meaning → pronunciation → example → save it.
    </p>
</div>


<!-- LOOKUP -->

<div class="card">

    <div class="row">

        <input
            id="wordInput"
            placeholder="Speak or type a word..."
            autocomplete="off"
        >

        <button
            class="primary"
            onclick="startSpeech()"
        >
            🎙️ Speak
        </button>

        <button
            onclick="lookupWord()"
        >
            🔎 Search
        </button>

        <button
            onclick="googleSearch()"
        >
            Google
        </button>

    </div>


    <div id="status">
        Ready. Tap Speak and say an English word.
    </div>


    <div
        id="result"
        class="result"
    >

        <div
            id="resultWord"
            class="result-word"
        ></div>


        <div
            id="resultPart"
            class="part"
        ></div>


        <div
            id="resultPronunciation"
            class="pronunciation"
        ></div>


        <div class="actions">

            <button
                class="audio"
                onclick="speakCurrentWord()"
            >
                🔊 Listen
            </button>

        </div>


        <div
            id="resultDefinition"
            class="definition"
        ></div>


        <div
            id="resultExample"
            class="example"
            style="display:none"
        ></div>


        <div class="actions">

            <button
                class="primary"
                onclick="saveCurrentWord()"
            >
                💾 Save Word
            </button>

        </div>

    </div>

</div>



<!-- SAVED WORDS -->

<div class="card">

    <div
        style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        "
    >

        <h2 style="margin:0">
            📚 My Vocabulary
        </h2>

        <span
            id="count"
            class="count"
        >
            0 words
        </span>

    </div>


    <div
        class="row"
        style="margin-top:12px"
    >

        <input
            id="filterInput"
            placeholder="Search saved words..."
            oninput="renderSavedWords()"
        >

        <button
            onclick="exportCSV()"
        >
            📊 Download CSV
        </button>

        <button
            onclick="deleteAllWords()"
            class="danger"
        >
            Delete All
        </button>

    </div>


    <div id="savedList"></div>

</div>

</div>



<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
"speak-save-dictionary-v4";


let savedWords =
JSON.parse(
localStorage.getItem(STORAGE_KEY) || "[]"
);


let currentWord = null;


/* =========================================================
   HELPER
========================================================= */

function $(id){
    return document.getElementById(id);
}


function setStatus(message){
    $("status").textContent = message;
}


function escapeHTML(text){

    if(!text){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function startSpeech(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        setStatus(
            "Speech recognition is not supported. Use Chrome on Android."
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang = "en-IN";

    recognition.interimResults = false;

    recognition.maxAlternatives = 3;


    setStatus(
        "🎙️ Listening... speak now."
    );


    recognition.onresult =
        function(event){

            let spokenWord =
                event
                .results[0][0]
                .transcript
                .trim();


            spokenWord =
                spokenWord
                .replace(/[.,!?]$/,"");


            $("wordInput").value =
                spokenWord;


            lookupWord();

        };


    recognition.onerror =
        function(event){

            setStatus(
                "Microphone error: " +
                event.error
            );

        };


    try{

        recognition.start();

    }

    catch(error){

        setStatus(
            "Unable to start microphone. Try again."
        );

    }

}


/* =========================================================
   WIKTAPI
========================================================= */

async function getWiktEntry(word){

    const url =
        "https://api.wiktapi.dev/v1/en/word/" +
        encodeURIComponent(word);


    try{

        const response =
            await fetch(url);


        if(!response.ok){
            return null;
        }


        return await response.json();

    }

    catch(error){

        return null;

    }

}


/* =========================================================
   SEARCH FALLBACK
========================================================= */

async function searchWikt(word){

    const url =
        "https://api.wiktapi.dev/v1/en/search?q=" +
        encodeURIComponent(word);


    try{

        const response =
            await fetch(url);


        if(!response.ok){
            return null;
        }


        return await response.json();

    }

    catch(error){

        return null;

    }

}


/* =========================================================
   GET ENTRY
========================================================= */

function chooseEntry(data){

    if(!data){
        return null;
    }


    if(
        data.entries &&
        Array.isArray(data.entries)
    ){

        return data.entries.find(
            function(entry){

                return (
                    !entry.lang_code ||
                    entry.lang_code === "en"
                );

            }
        ) || data.entries[0];

    }


    return null;

}


/* =========================================================
   LOOKUP
========================================================= */

async function lookupWord(){

    const originalWord =
        $("wordInput")
        .value
        .trim();


    if(!originalWord){

        setStatus(
            "Please speak or type a word first."
        );

        return;

    }


    $("result").style.display =
        "none";


    setStatus(
        "🔎 Looking up \"" +
        originalWord +
        "\"..."
    );


    currentWord = null;


    let lookupWord =
        originalWord;


    let data =
        await getWiktEntry(
            lookupWord
        );


    let entry =
        chooseEntry(data);


    /*
       If exact word doesn't work,
       search WiktApi.
    */

    if(!entry){

        const search =
            await searchWikt(
                originalWord
            );


        if(
            search &&
            search.results &&
            search.results.length
        ){

            const candidate =
                search.results[0].word;


            if(candidate){

                lookupWord =
                    candidate;


                data =
                    await getWiktEntry(
                        lookupWord
                    );


                entry =
                    chooseEntry(data);

            }

        }

    }


    if(!entry){

        setStatus(
            "Couldn't find the definition. Try Google."
        );

        return;

    }


    /* =====================================================
       PART OF SPEECH
    ===================================================== */

    const partOfSpeech =
        entry.pos ||
        "";


    /* =====================================================
       DEFINITIONS
    ===================================================== */

    let definitions = [];

    let examples = [];


    if(
        entry.senses &&
        Array.isArray(entry.senses)
    ){

        entry.senses
        .forEach(
            function(sense){

                if(
                    sense.glosses &&
                    sense.glosses.length
                ){

                    sense.glosses
                    .forEach(
                        function(gloss){

                            if(
                                !definitions.includes(
                                    gloss
                                )
                            ){

                                definitions.push(
                                    gloss
                                );

                            }

                        }
                    );

                }


                if(
                    sense.examples &&
                    sense.examples.length
                ){

                    sense.examples
                    .forEach(
                        function(example){

                            let text = "";


                            if(
                                typeof example ===
                                "string"
                            ){

                                text =
                                    example;

                            }

                            else if(
                                example &&
                                example.text
                            ){

                                text =
                                    example.text;

                            }


                            if(
                                text &&
                                !examples.includes(
                                    text
                                )
                            ){

                                examples.push(
                                    text
                                );

                            }

                        }
                    );

                }

            }
        );

    }


    const definition =
        definitions
        .slice(0,3)
        .join("; ");


    const example =
        examples[0] ||
        "";


    if(!definition){

        setStatus(
            "Word found, but no usable definition was returned. Try Google."
        );

        return;

    }


    /* =====================================================
       PRONUNCIATION
    ===================================================== */

    let pronunciation =
        "";


    if(
        entry.sounds &&
        Array.isArray(entry.sounds)
    ){

        for(
            const sound of entry.sounds
        ){

            if(
                sound.ipa
            ){

                pronunciation =
                    sound.ipa;

                break;

            }

        }

    }


    /* =====================================================
       CURRENT WORD OBJECT
    ===================================================== */

    currentWord = {

        word:
            originalWord,

        lookupWord:
            lookupWord,

        partOfSpeech:
            partOfSpeech,

        pronunciation:
            pronunciation,

        definition:
            definition,

        example:
            example,

        created:
            new Date().toISOString()

    };


    /* =====================================================
       DISPLAY
    ===================================================== */

    $("resultWord").textContent =
        originalWord;


    $("resultPart").textContent =
        partOfSpeech
        ? partOfSpeech
        : "";


    $("resultPronunciation").textContent =
        pronunciation
        ? "🔤 " + pronunciation
        : "🔤 Pronunciation unavailable";


    $("resultDefinition").innerHTML =
        "<strong>Meaning</strong><br>" +
        escapeHTML(
            definition
        );


    if(example){

        $("resultExample").style.display =
            "block";


        $("resultExample").innerHTML =
            "<strong>Example</strong><br>" +
            escapeHTML(
                example
            );

    }

    else{

        $("resultExample").style.display =
            "none";

    }


    $("result").style.display =
        "block";


    setStatus(
        "✅ Meaning found. You can listen and save it."
    );

}


/* =========================================================
   TEXT-TO-SPEECH
   PRIMARY LISTEN FEATURE
========================================================= */

function speakText(text){

    if(
        !("speechSynthesis" in window)
    ){

        setStatus(
            "Your browser doesn't support speech pronunciation."
        );

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    /*
       English pronunciation
    */

    utterance.lang =
        "en-US";


    /*
       Slightly slower so
       pronunciation is clear.
    */

    utterance.rate =
        0.72;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    utterance.onstart =
        function(){

            setStatus(
                "🔊 Pronouncing..."
            );

        };


    utterance.onend =
        function(){

            setStatus(
                "Pronunciation finished."
            );

        };


    utterance.onerror =
        function(){

            setStatus(
                "Couldn't play pronunciation. Try again."
            );

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   LISTEN CURRENT WORD
========================================================= */

function speakCurrentWord(){

    if(!currentWord){

        setStatus(
            "Search for a word first."
        );

        return;

    }


    speakText(
        currentWord.word
    );

}


/* =========================================================
   SAVE WORD
========================================================= */

function saveCurrentWord(){

    if(!currentWord){

        setStatus(
            "Search for a word first."
        );

        return;

    }


    const existing =
        savedWords.find(
            function(item){

                return (
                    item.word.toLowerCase() ===
                    currentWord.word.toLowerCase()
                );

            }
        );


    if(existing){

        existing.partOfSpeech =
            currentWord.partOfSpeech;

        existing.pronunciation =
            currentWord.pronunciation;

        existing.definition =
            currentWord.definition;

        existing.example =
            currentWord.example;

        existing.updated =
            new Date().toISOString();


        setStatus(
            "Existing word updated."
        );

    }

    else{

        savedWords.unshift({

            id:
                Date.now().toString(),

            word:
                currentWord.word,

            partOfSpeech:
                currentWord.partOfSpeech,

            pronunciation:
                currentWord.pronunciation,

            definition:
                currentWord.definition,

            example:
                currentWord.example,

            created:
                new Date().toISOString()

        });


        setStatus(
            "💾 Word saved successfully."
        );

    }


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            savedWords
        )
    );


    renderSavedWords();

}


/* =========================================================
   GOOGLE SEARCH
========================================================= */

function googleSearch(){

    const word =
        $("wordInput")
        .value
        .trim();


    if(!word){

        setStatus(
            "Please enter a word first."
        );

        return;

    }


    window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(
            word + " meaning"
        ),
        "_blank"
    );

}


/* =========================================================
   SAVED WORD LIST
========================================================= */

function renderSavedWords(){

    const query =
        $("filterInput")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        savedWords.filter(
            function(item){

                return (

                    item.word
                    .toLowerCase()
                    .includes(query)

                    ||

                    item.definition
                    .toLowerCase()
                    .includes(query)

                );

            }
        );


    $("count").textContent =
        savedWords.length +
        (
            savedWords.length === 1
            ? " word"
            : " words"
        );


    if(
        filtered.length === 0
    ){

        $("savedList").innerHTML =

        `
        <div
        style="
        text-align:center;
        color:#667085;
        padding:25px;
        "
        >
        No saved words yet.
        </div>
        `;

        return;

    }


    $("savedList").innerHTML =

        filtered
        .map(
            function(item){

                return `

                <div class="saved-item">

                    <div class="saved-word">
                        ${escapeHTML(item.word)}
                    </div>

                    ${
                        item.partOfSpeech
                        ?
                        `<div class="meta">
                            ${escapeHTML(
                                item.partOfSpeech
                            )}
                        </div>`
                        :
                        ""
                    }

                    ${
                        item.pronunciation
                        ?
                        `<div class="saved-pronunciation">
                            🔤 ${escapeHTML(
                                item.pronunciation
                            )}
                        </div>`
                        :
                        ""
                    }

                    <div class="saved-definition">
                        ${escapeHTML(
                            item.definition
                        )}
                    </div>

                    ${
                        item.example
                        ?
                        `<div class="saved-example">
                            Example:
                            ${escapeHTML(
                                item.example
                            )}
                        </div>`
                        :
                        ""
                    }

                    <div class="actions">

                        <button
                        class="audio"
                        onclick="speakText(
                            ${JSON.stringify(item.word)}
                        )"
                        >
                        🔊 Listen
                        </button>

                        <button
                        onclick="googleSavedWord(
                            '${item.id}'
                        )"
                        >
                        🔎 Google
                        </button>

                        <button
                        class="danger"
                        onclick="deleteWord(
                            '${item.id}'
                        )"
                        >
                        Delete
                        </button>

                    </div>

                    <div class="meta">
                        Saved:
                        ${formatDate(
                            item.created
                        )}
                    </div>

                </div>

                `;

            }
        )
        .join("");

}


/* =========================================================
   DATE
========================================================= */

function formatDate(dateString){

    if(!dateString){
        return "";
    }


    const date =
        new Date(dateString);


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   DELETE WORD
========================================================= */

window.deleteWord =
function(id){

    if(
        !confirm(
            "Delete this word?"
        )
    ){

        return;

    }


    savedWords =
        savedWords.filter(
            function(item){

                return item.id !== id;

            }
        );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            savedWords
        )
    );


    renderSavedWords();

};


/* =========================================================
   GOOGLE SAVED WORD
========================================================= */

window.googleSavedWord =
function(id){

    const item =
        savedWords.find(
            function(x){

                return x.id === id;

            }
        );


    if(!item){
        return;
    }


    window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(
            item.word + " meaning"
        ),
        "_blank"
    );

};


/* =========================================================
   DELETE ALL
========================================================= */

function deleteAllWords(){

    if(
        savedWords.length === 0
    ){

        return;

    }


    if(
        !confirm(
            "Delete all saved vocabulary? This cannot be undone."
        )
    ){

        return;

    }


    savedWords = [];


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            savedWords
        )
    );


    renderSavedWords();

}


/* =========================================================
   CSV ESCAPE
========================================================= */

function csvEscape(value){

    if(
        value === null ||
        value === undefined
    ){

        return '""';

    }


    const text =
        String(value)
        .replace(/"/g,'""');


    return '"' +
        text +
        '"';

}


/* =========================================================
   CSV EXPORT
========================================================= */

function exportCSV(){

    if(
        savedWords.length === 0
    ){

        alert(
            "There are no saved words to export."
        );

        return;

    }


    /*
       CSV columns
    */

    const headers = [

        "Word",

        "Part of Speech",

        "Pronunciation",

        "Meaning",

        "Example",

        "Date Saved"

    ];


    const rows = [
        headers
    ];


    savedWords.forEach(
        function(item){

            rows.push([

                item.word || "",

                item.partOfSpeech || "",

                item.pronunciation || "",

                item.definition || "",

                item.example || "",

                formatDate(
                    item.created
                )

            ]);

        }
    );


    /*
       Convert to CSV
    */

    const csv =
        rows
        .map(
            function(row){

                return row
                .map(csvEscape)
                .join(",");

            }
        )
        .join("\r\n");


    /*
       UTF-8 BOM helps Excel
       correctly recognize UTF-8.
    */

    const BOM =
        "\uFEFF";


    const blob =
        new Blob(
            [
                BOM + csv
            ],
            {
                type:
                "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "my-vocabulary.csv";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );


    setStatus(
        "📊 Vocabulary CSV downloaded successfully."
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

renderSavedWords();

</script>

</body>
</html>
